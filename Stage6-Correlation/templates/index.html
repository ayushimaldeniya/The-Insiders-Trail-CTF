<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexora Incident Correlation Console</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #38bdf8; padding: 30px; }
        .box { background: #1e293b; padding: 20px; border-radius: 8px; max-width: 500px; }
        input { width: 90%; padding: 8px; margin: 8px 0; background: #0f172a; color: #fff; border: 1px solid #38bdf8; }
        button { background: #0284c7; color: white; padding: 10px 15px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>SOC Incident Correlation Console</h2>
        <form id="corrForm">
            <label>1. Key Cipher Identifier (Stage 1):</label><br>
            <input type="text" name="clue1" required><br>
            <label>2. Suspect OSINT Alias (Stage 2):</label><br>
            <input type="text" name="clue2" required><br>
            <label>3. Stego Image Passphrase (Stage 3):</label><br>
            <input type="text" name="clue3" required><br>
            <label>4. Linux Backdoor Callback (Stage 4):</label><br>
            <input type="text" name="clue4" required><br>
            <label>5. Forensics ZIP Password (Stage 5):</label><br>
            <input type="text" name="clue5" required><br><br>
            <button type="submit">Verify Correlation</button>
        </form>
        <h3 id="result"></h3>
    </div>
    <script>
        document.getElementById('corrForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            const res = await fetch('/correlate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const json = await res.json();
            document.getElementById('result').innerText = json.flag || json.message;
        };
    </script>
</body>
</html>
